function peClass(pe) {
  if (pe === null || pe === undefined) return 'pe-warn';
  if (pe < 20) return 'pe-good';
  if (pe < 35) return 'pe-warn';
  return 'pe-bad';
}

function changeClass(pct) {
  if (pct > 0) return 'up';
  if (pct < 0) return 'down';
  return 'flat';
}

function changeSign(pct) {
  if (pct > 0) return '+' + pct.toFixed(2) + '%';
  return pct.toFixed(2) + '%';
}

function fmtPe(pe) { return pe !== null ? pe.toFixed(1) : 'N/A'; }
function fmtPct(v) { return v !== null ? (v > 0 ? '+' + v.toFixed(1) + '%' : v.toFixed(1) + '%') : 'N/A'; }
function fmtRoe(r) { return r !== null ? r.toFixed(1) + '%' : 'N/A'; }

let openCards = new Set();

function buildCard(s) {
  const colors = RATING_COLORS[s.rating] || RATING_COLORS['🟡觀望'];
  const fin = finData[s.code] || {};
  const sectorMood = SECTOR_MOOD[s.sector] || s.sector;
  const changeC = changeClass(s.change_pct);
  const peC = peClass(fin.pe);
  const isOpen = openCards.has(s.code) ? 'open' : '';

  return `
  <div class="stock-card" data-rating="${s.rating}" id="card-${s.code}">
    <div class="card-header ${isOpen}" onclick="toggleCard('${s.code}')">
      <div class="rank-badge">${s.rank}</div>
      <div class="stock-title">
        <div class="stock-name">${s.name}</div>
        <div class="stock-code">${s.code} · ${s.sector}</div>
      </div>
      <div class="rating-badge" style="background:${colors.bg};color:${colors.color}">${s.rating}</div>
      <div class="price-info">
        <div class="price-main">${s.price !== null ? s.price.toLocaleString() : 'N/A'}</div>
        <div class="price-change ${changeC}">${changeSign(s.change_pct)}</div>
      </div>
      <div class="toggle-icon">▶</div>
    </div>
    <div class="card-body ${isOpen}">
      <div class="section-grid">
        <div class="section-block full">
          <div class="section-title">💼 產業分析</div>
          <div class="section-content">${sectorMood}</div>
        </div>
        <div class="section-block full">
          <div class="section-title">📰 消息面</div>
          <div class="section-content">${s.reason}</div>
        </div>
        <div class="section-block full">
          <div class="section-title">📊 評估依據</div>
          <div class="section-content">
            <strong>優點：</strong>${s.moat}<br>
            <strong>基本面：</strong>${s.fundamentals}<br>
            <strong>技術面：</strong>${s.technical}<br>
            <strong>法人動向：</strong>${s.institutional}
          </div>
        </div>
      </div>
      <div class="tech-grid">
        <div class="tech-item">
          <div class="tech-label">本益比 (P/E)</div>
          <div class="tech-value ${peC}">${fmtPe(fin.pe)}</div>
        </div>
        <div class="tech-item">
          <div class="tech-label">EPS</div>
          <div class="tech-value">${fin.eps !== null ? fin.eps.toFixed(2) : 'N/A'}</div>
        </div>
        <div class="tech-item">
          <div class="tech-label">ROE</div>
          <div class="tech-value">${fmtRoe(fin.roe)}</div>
        </div>
        <div class="tech-item">
          <div class="tech-label">營收成長</div>
          <div class="tech-value ${fin.revGrowth !== null ? (fin.revGrowth > 0 ? 'up' : 'down') : ''}">${fmtPct(fin.revGrowth)}</div>
        </div>
        <div class="tech-item">
          <div class="tech-label">市值</div>
          <div class="tech-value">${fin.marketCap || 'N/A'}</div>
        </div>
        <div class="tech-item">
          <div class="tech-label">今日漲跌</div>
          <div class="tech-value ${changeC}">${changeSign(s.change_pct)}</div>
        </div>
      </div>
    </div>
  </div>`;
}

function toggleCard(code) {
  if (openCards.has(code)) {
    openCards.delete(code);
  } else {
    openCards.add(code);
  }
  const card = document.getElementById('card-' + code);
  const header = card.querySelector('.card-header');
  const body = card.querySelector('.card-body');
  header.classList.toggle('open', openCards.has(code));
  body.classList.toggle('open', openCards.has(code));
}

function render(filter) {
  const list = document.getElementById('stock-list');
  const filtered = filter === 'all' ? stocks : stocks.filter(s => s.rating === filter);
  list.innerHTML = filtered.map(buildCard).join('');

  // Update filter button states
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.filter === filter);
  });
}

document.addEventListener('DOMContentLoaded', () => {
  render('all');
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => render(btn.dataset.filter));
  });
});
</script>
